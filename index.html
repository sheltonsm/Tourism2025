<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tourism and Motel Ratings (2020)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }




.custom-motel-marker {
    background: transparent;
    border: none;
}

.legend {
    line-height: 32px;
    font-size: 14px;
    width: 220px;
    color: #333333;
    padding: 6px 8px;
    background: white;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 5px;
    font-family: 'Titillium Web', sans-serif;
}
 
.legend i {
    width: 16px;
    height: 16px;
    float: left;
    margin-right: 8px;
    margin-top: 8px;
    opacity: 0.9;
}
 
.legend p {
    font-size: 13px;
    line-height: 32px;
    margin: 0;
}

.legend hr {
    margin: 6px 0;
    border: none;
    border-top: 1px solid #ccc;
}
</style>
<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
<!-- Fixed jQuery CDN link -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
</head>

<body>
<!-- Our web map and content will go here -->
<div id="map"></div>
<script>
// 1. Create a map object.
var mymap = L.map('map', {
    center: [35.7596, -79.0193], 
    zoom: 7,                     
    maxZoom: 15,                 
    minZoom: 6,                  
    detectRetina: true           
});

// 2. Add a base map.
var Esri_WorldGrayCanvas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, Tourism Data From VisitNC Website(2025), Star Ratings from Google, A Map by Samuel Shelton' ,
    maxZoom: 16
}).addTo(mymap);

// 3. Add Scale Bar
L.control.scale({position: 'bottomleft'}).addTo(mymap);

// 4. Set up color ramp for polygon choropleth (7 classes of Purples)
var colors = chroma.scale('Purples').colors(7); 
 
// 5. Set function for skewed color classification with 7 classes
function setColor(density) {
    var id = 0;
    if (density > 5000) { id = 6; }                 
    else if (density > 3000 && density <= 5000) { id = 5; }
    else if (density > 1500 && density <= 3000) { id = 4; }
    else if (density > 500 && density <= 1500)  { id = 3; }
    else if (density > 200 && density <= 500)   { id = 2; }
    else if (density > 50 && density <= 200)    { id = 1; }
    else { id = 0; }                                
    return colors[id];
}

// 6. Set style function for polygons
function style(feature) {
    var rawValue = feature.properties.usd_millions;
    var cleanValue = parseFloat(String(rawValue).replace(/[$,]/g, '')) || 0;

    return {
        fillColor: setColor(cleanValue),
        fillOpacity: 0.85,
        weight: 2,
        opacity: 1,
        color: '#b4b4b4',
        dashArray: '4'
    };
}

// 7. ADD POLYGONS FIRST (Background layer)
L.geoJson.ajax("assets/overlymapped.geojson", {
    style: style
}).addTo(mymap);


// 8. Define Yellow -> Orange -> Red colors for Motel Star Ratings
function getMotelColor(rating) {
    return rating > 3.5 ? '#e31a1c' : // High: Vibrant Red (3.6 - 4.2)
           rating > 3.0 ? '#fd8d3c' : // Mid: Bright Orange (3.1 - 3.5)
                          '#fed976';  // Low: Golden Yellow (2.6 - 3.0)
}

// 9. ADD MOTEL POINTS SECOND with automatic property key trimming
$.getJSON("assets/motels.geojson", function(data) {
    L.geoJson(data, {
        pointToLayer: function (feature, latlng) {
            var cleanProps = {};
            for (var key in feature.properties) {
                cleanProps[key.trim()] = feature.properties[key];
            }
            
            var rating = parseFloat(cleanProps.Star_Rating) || 0;
            var starColor = getMotelColor(rating);
            
            return L.marker(latlng, {
                icon: L.divIcon({
                    className: 'custom-motel-marker',
                    html: '<i class="fa-solid fa-star" style="color: ' + starColor + '; font-size: 16px; text-shadow: 0 0 2px #333333;"></i>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                })
            });
        },
        onEachFeature: function (feature, layer) {
            var cleanProps = {};
            for (var key in feature.properties) {
                cleanProps[key.trim()] = feature.properties[key];
            }
            if (cleanProps.Star_Rating) {
                layer.bindPopup("<b>Star Rating:</b> " + cleanProps.Star_Rating);
            }
        }
    }).addTo(mymap);
});


// 10. Create Leaflet Control Object for Legend
var legend = L.control({position: 'topright'});
 
// 11. Function that runs legend items
legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>Value ($ Millions)</b><br />';
    
    // 7 Skewed polygon classes
    div.innerHTML += '<i style="background: ' + colors[6] + '; opacity: 0.85"></i><p>$5,000M+</p>';
    div.innerHTML += '<i style="background: ' + colors[5] + '; opacity: 0.85"></i><p>$3,001M - $5,000M</p>';
    div.innerHTML += '<i style="background: ' + colors[4] + '; opacity: 0.85"></i><p>$1,501M - $3,000M</p>';
    div.innerHTML += '<i style="background: ' + colors[3] + '; opacity: 0.85"></i><p>$501M - $1,500M</p>';
    div.innerHTML += '<i style="background: ' + colors[2] + '; opacity: 0.85"></i><p>$201M - $500M</p>';
    div.innerHTML += '<i style="background: ' + colors[1] + '; opacity: 0.85"></i><p>$51M - $200M</p>';
    div.innerHTML += '<i style="background: ' + colors[0] + '; opacity: 0.85"></i><p>$4M - $50M</p>';
    
    // Motel Star Rating section (Red -> Orange -> Yellow)
    div.innerHTML += '<hr><b>Motel Star Rating</b><br />';
    div.innerHTML += '<i class="fa-solid fa-star" style="color: #e31a1c; text-shadow: 0 0 1px #333; width:16px; height:16px; float:left; margin-right:8px; margin-top:2px; font-size:14px;"></i><p>3.6 - 4.2 Stars</p>';
    div.innerHTML += '<i class="fa-solid fa-star" style="color: #fd8d3c; text-shadow: 0 0 1px #333; width:16px; height:16px; float:left; margin-right:8px; margin-top:2px; font-size:14px;"></i><p>3.1 - 3.5 Stars</p>';
    div.innerHTML += '<i class="fa-solid fa-star" style="color: #fed976; text-shadow: 0 0 1px #333; width:16px; height:16px; float:left; margin-right:8px; margin-top:2px; font-size:14px;"></i><p>2.6 - 3.0 Stars</p>';
    
    return div;
};

// 12. Add legend to map
legend.addTo(mymap);
</script>
</body>
</html>
